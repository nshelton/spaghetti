[workspace]
resolver = "2"
members = [
    "crates/core-ir",
    "crates/frontend-clang",
    "crates/frontend-ispc",
    "crates/layout",
    "crates/query",
    "crates/viz",
]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Collections
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math
glam = "0.32"

# Parallelism
rayon = "1"

# GUI
eframe = "0.34"
egui = "0.34"
rfd = "0.15"

# Hashing
seahash = "4"

# Shell-quoted command parsing (JSON compilation database `command` field)
shlex = "1"

# ISPC parsing (frontend-ispc vendors the grammar, cc compiles it)
tree-sitter = "0.25"
cc = "1"

# Internal crates
core-ir = { path = "crates/core-ir" }
frontend-clang = { path = "crates/frontend-clang" }
frontend-ispc = { path = "crates/frontend-ispc" }
layout = { path = "crates/layout" }
query = { path = "crates/query" }

# Debug builds are unusable on 100k-node graphs without optimized
# dependencies (egui tessellation, serde cache loads). "*" covers external
# deps only, so hot workspace crates get explicit overrides.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.layout]
opt-level = 2

[profile.dev.package.core-ir]
opt-level = 2
